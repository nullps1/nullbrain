name: nullbrain-ai

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "2048"
    volumes:
      - /srv/nullbrain/data/ollama:/root/.ollama
    mem_limit: 6g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
